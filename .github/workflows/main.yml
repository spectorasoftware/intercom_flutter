# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # job for plugin intercom_flutter
  intercom_flutter:
    runs-on: ubuntu-latest
    env:
      source-directory: ./intercom_flutter

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
      with:
        java-version: '12.x'
    - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
      with:
        channel: 'stable'
    
    # Download all Flutter packages
    - name: Download dependencies
      run: flutter pub get
      working-directory: ${{env.source-directory}}

    # Check for any formatting issues in the code.
    - name: check code format
      run: dart format --set-exit-if-changed .
      working-directory: ${{env.source-directory}}

    # Run Flutter Analyzer
    - name: Run Flutter Analyzer
      run: flutter analyze
      working-directory: ${{env.source-directory}}

    # Run all unit-tests with code coverage
    - name: Run unit tests
      run: flutter test --coverage
      working-directory: ${{env.source-directory}}

  # job for plugin intercom_flutter_platform_interface
  intercom_flutter_platform_interface:
    runs-on: ubuntu-latest
    env:
      source-directory: ./intercom_flutter_platform_interface

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
      with:
        java-version: '12.x'
    - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
      with:
        channel: 'stable'
    
    # Download all Flutter packages
    - name: Download dependencies
      run: flutter pub get
      working-directory: ${{env.source-directory}}

    # Check for any formatting issues in the code.
    - name: check code format
      run: dart format --set-exit-if-changed .
      working-directory: ${{env.source-directory}}

    # Run Flutter Analyzer
    - name: Run Flutter Analyzer
      run: flutter analyze
      working-directory: ${{env.source-directory}}

    # Run all unit-tests with code coverage
    - name: Run unit tests
      run: flutter test --coverage
      working-directory: ${{env.source-directory}}

  # job for plugin intercom_flutter_web
  intercom_flutter_web:
    runs-on: ubuntu-latest
    env:
      source-directory: ./intercom_flutter_web/example

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - uses: nanasess/setup-chromedriver@c75c3d53d445b96d41dbf2355797b470953c6c30 # v2.4.0
    - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
      with:
        channel: 'master'
    
    # Download all Flutter packages
    - name: Download dependencies
      run: flutter pub get
      working-directory: ${{env.source-directory}}

    # Check for any formatting issues in the code.
    - name: check code format
      run: dart format --set-exit-if-changed .
      working-directory: ${{env.source-directory}}

    # Run Flutter Analyzer
    - name: Run Flutter Analyzer
      run: flutter analyze
      working-directory: ${{env.source-directory}}

    # Run chrome driver
    - name: Run chrome driver
      run: chromedriver --port=4444 &
      working-directory: ${{env.source-directory}}

    # Run all integration tests
    - name: Run integration tests
      run: flutter drive -d web-server --browser-name=chrome --driver=test_driver/integration_test.dart --target=integration_test/intercom_flutter_web_test.dart
      working-directory: ${{env.source-directory}}
